services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=courtwatch
      - POSTGRES_PASSWORD=courtwatch
      - POSTGRES_DB=courtwatch
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # networks:
    #   - court-watch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik Load Balancer & Reverse Proxy
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "3030:80" # HTTP (mapped to 3030 to avoid conflict)
      - "8080:8080" # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - court-watch-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://courtwatch:courtwatch@postgres:5432/courtwatch?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=backend-stripprefix"
      - "traefik.http.services.backend.loadbalancer.server.port=4001"
    networks:
      - court-watch-network
    restart: unless-stopped

  # Frontend Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    environment:
      - ORIGIN=http://localhost
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=PathPrefix(`/`)"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.routers.client.priority=1"
      - "traefik.http.services.client.loadbalancer.server.port=3000"
    networks:
      - court-watch-network
    restart: unless-stopped

networks:
  court-watch-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
